<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FixIt – View Reports</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   FixIt – shared stylesheet (used by all five pages)
   Palette: #021F28 navy, #0FFFC3 mint, #008B9B teal, #FF4078 coral
   ========================================================= */

/* To use the Mont font later, add your font files to /fonts and uncomment:
@font-face{font-family:"Mont";src:url("../fonts/Mont-Regular.woff2") format("woff2");font-weight:400}
@font-face{font-family:"Mont";src:url("../fonts/Mont-SemiBold.woff2") format("woff2");font-weight:600}
@font-face{font-family:"Mont";src:url("../fonts/Mont-Bold.woff2") format("woff2");font-weight:700}
*/

/* ---------- 1. Variables (change colours here only) ---------- */
:root {
  --navy: #021F28;
  --navy-light: #0A3B49;
  --teal: #008B9B;
  --teal-dark: #006B78;
  --mint: #0FFFC3;
  --coral: #FF4078;
  --coral-dark: #C4194F;
  --bg: #F1FBFC;
  --white: #FFFFFF;
  --text: #0B2A33;
  --muted: #4F7480;
  --border: #D3E8EC;
  /* soft tints that keep the page lively */
  --mint-tint: #D5FFF4;
  --coral-tint: #FFE2EA;
  --teal-tint: #D3F0F3;
  --sky: #CDEBFF;
  --lav: #E4DBFF;
  --peach: #FFE3C8;
  --leaf: #CFF5D8;
  --radius: 16px;
  --shadow: 0 6px 20px rgba(2, 31, 40, .08);
}

/* ---------- 2. Base ---------- */
*,
*::before,
*::after {
  box-sizing: border-box
}

[hidden] {
  display: none !important
}

html {
  scroll-behavior: smooth
}

body {
  margin: 0;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: "Mont", "Montserrat", system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.6
}

main {
  flex: 1
}

h1,
h2,
h3 {
  margin: 0;
  line-height: 1.2;
  font-weight: 700;
  color: var(--navy)
}

h1 {
  font-size: clamp(28px, 5vw, 44px)
}

h2 {
  font-size: 22px
}

h3 {
  font-size: 17px
}

p {
  margin: 0
}

a {
  color: var(--teal-dark)
}

button,
input,
select,
textarea {
  font-family: inherit
}

:focus-visible {
  outline: 3px solid var(--teal);
  outline-offset: 2px
}

.container {
  max-width: 1120px;
  margin: 0 auto;
  padding: 0 20px
}

section {
  padding: 28px 0
}

.text-muted {
  color: var(--muted)
}

/* ---------- 3. Header and navigation ---------- */
.site-header {
  position: sticky;
  top: 0;
  z-index: 30;
  background: linear-gradient(90deg, var(--navy), #04414D)
}

.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 68px
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  color: #fff;
  text-decoration: none;
  font-size: 22px;
  font-weight: 700
}

.logo b {
  color: var(--mint)
}

.logo-mark {
  width: 34px;
  height: 34px;
  border-radius: 11px;
  background: var(--mint);
  display: grid;
  place-items: center
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 4px
}

.nav-links a {
  color: #CFE8EC;
  text-decoration: none;
  font-weight: 600;
  font-size: 14px;
  padding: 9px 15px;
  border-radius: 999px;
  transition: .15s
}

.nav-links a:hover {
  color: #fff;
  background: rgba(255, 255, 255, .1)
}

.nav-links a.active {
  color: var(--mint);
  background: rgba(15, 255, 195, .14)
}

.nav-links a.nav-cta {
  background: var(--mint);
  color: var(--navy);
  margin: 0 6px;
  font-weight: 700
}

.nav-links a.nav-cta:hover {
  filter: brightness(1.07)
}

.nav-links a.nav-cta.active {
  box-shadow: 0 0 0 3px rgba(15, 255, 195, .4)
}

.nav-toggle {
  display: none;
  background: none;
  border: 1px solid rgba(255, 255, 255, .3);
  color: #fff;
  border-radius: 10px;
  padding: 7px 12px;
  font-size: 18px;
  cursor: pointer
}

/* ---------- 4. Banner / hero with curved page body ---------- */
.hero,
.page-banner {
  position: relative;
  overflow: hidden;
  color: #fff;
  background: linear-gradient(120deg, var(--navy) 0%, #04515F 55%, var(--teal) 100%)
}

.hero {
  padding: 56px 0 96px
}

.page-banner {
  padding: 38px 0 84px
}

.hero::before,
.page-banner::before {
  content: "";
  position: absolute;
  right: -60px;
  top: -80px;
  width: 340px;
  height: 340px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(15, 255, 195, .35), transparent 70%)
}

.hero::after,
.page-banner::after {
  content: "";
  position: absolute;
  right: 140px;
  bottom: -70px;
  width: 200px;
  height: 200px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 64, 120, .4), transparent 70%)
}

.hero .container,
.page-banner .container {
  position: relative;
  z-index: 1
}

.hero h1,
.page-banner h1 {
  color: #fff
}

.hero h1 span,
.page-banner h1 span {
  color: var(--mint)
}

.hero p,
.page-banner p {
  color: #CFE8EC;
  margin-top: 12px;
  max-width: 560px;
  font-size: 17px
}

.tagline {
  display: inline-block;
  margin-bottom: 12px;
  padding: 4px 14px;
  border-radius: 999px;
  background: rgba(255, 64, 120, .18);
  color: #FFB3C8;
  font-size: 13px;
  font-weight: 600
}

.hero-actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 24px
}

.page-body {
  position: relative;
  margin-top: -44px;
  background: var(--bg);
  border-radius: 40px 40px 0 0;
  padding: 34px 0 20px
}

.section-title {
  margin-bottom: 6px
}

.section-title::after {
  content: "";
  display: block;
  width: 38px;
  height: 4px;
  border-radius: 4px;
  background: var(--mint);
  margin-top: 8px
}

.section-sub {
  color: var(--muted);
  margin-bottom: 18px
}

.demo-note {
  display: inline-block;
  font-size: 12px;
  color: var(--muted);
  border: 1px dashed var(--border);
  border-radius: 10px;
  padding: 5px 12px;
  background: #fff
}

/* ---------- 5. Layout helpers ---------- */
.grid {
  display: grid;
  gap: 16px;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr))
}

.two-col {
  display: grid;
  grid-template-columns: 1.5fr 1fr;
  gap: 24px;
  align-items: start
}

/* ---------- 6. Buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 24px;
  border: 2px solid var(--mint);
  border-radius: 14px;
  background: var(--mint);
  color: var(--navy);
  font-size: 15px;
  font-weight: 700;
  text-decoration: none;
  cursor: pointer;
  box-shadow: 0 6px 16px rgba(15, 255, 195, .28);
  transition: .15s
}

.btn:hover {
  transform: translateY(-1px);
  filter: brightness(1.06)
}

.btn-outline {
  background: transparent;
  color: var(--teal-dark);
  border-color: var(--teal);
  box-shadow: none
}

.btn-outline:hover {
  background: var(--teal-tint)
}

.hero .btn-outline,
.page-banner .btn-outline {
  color: #fff;
  border-color: rgba(255, 255, 255, .6)
}

.btn-sm {
  padding: 7px 14px;
  font-size: 13px;
  border-radius: 10px
}

/* ---------- 7. Cards ---------- */
.card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px;
  box-shadow: var(--shadow)
}

.tint-mint {
  background: var(--mint-tint)
}

.tint-coral {
  background: var(--coral-tint)
}

.tint-teal {
  background: var(--teal-tint)
}

.tint-sky {
  background: var(--sky)
}

.tint-lav {
  background: var(--lav)
}

.tint-peach {
  background: var(--peach)
}

.tint-leaf {
  background: var(--leaf)
}

.stat-card {
  display: flex;
  align-items: center;
  gap: 14px
}

.stat-icon {
  width: 50px;
  height: 50px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  font-size: 24px
}

.stat-value {
  display: block;
  font-size: 28px;
  font-weight: 700;
  line-height: 1.1;
  color: var(--navy)
}

.stat-label {
  color: var(--muted);
  font-size: 14px
}

.category-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 18px 20px;
  border-radius: 18px;
  color: var(--navy);
  font-weight: 600;
  text-decoration: none;
  box-shadow: var(--shadow);
  transition: .15s
}

.category-card:hover {
  transform: translateY(-3px)
}

.category-card .arrow {
  margin-left: auto;
  color: var(--coral-dark)
}

.cat-facilities {
  background: var(--mint-tint)
}

.cat-electricity {
  background: var(--coral-tint)
}

.cat-water {
  background: var(--sky)
}

.cat-internet {
  background: var(--lav)
}

.cat-cleanliness {
  background: var(--peach)
}

.cat-safety {
  background: var(--teal-tint)
}

.cat-accessibility {
  background: var(--leaf)
}

.cat-other {
  background: var(--lav)
}

.report-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 20px;
  margin-bottom: 12px;
  color: inherit;
  text-decoration: none;
  transition: .15s
}

.report-row:hover {
  border-color: var(--teal);
  transform: translateX(3px)
}

.report-row .meta {
  color: var(--muted);
  font-size: 13px
}

.report-row .badge {
  margin-left: auto
}

.step-card {
  display: flex;
  gap: 14px
}

.step-number {
  flex: none;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--mint);
  color: var(--navy);
  font-weight: 700;
  display: inline-grid;
  place-items: center
}

/* ---------- 8. Status badges ---------- */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap
}

.badge-pending {
  background: var(--coral-tint);
  color: var(--coral-dark)
}

.badge-progress {
  background: var(--teal-tint);
  color: #00606C
}

.badge-resolved {
  background: var(--mint-tint);
  color: #00694F
}

/* ---------- 9. Forms ---------- */
.form-section {
  margin-bottom: 22px
}

.form-section-title {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
  font-size: 18px
}

.form-group {
  margin-bottom: 18px
}

label {
  display: block;
  margin-bottom: 6px;
  font-size: 14px;
  font-weight: 600;
  color: var(--navy)
}

.required {
  color: var(--coral-dark)
}

input,
select,
textarea {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  background: #F8FDFE;
  color: var(--text);
  font-size: 15px;
  transition: .15s
}

input::placeholder,
textarea::placeholder {
  color: #7F9DA6
}

input:focus,
select:focus,
textarea:focus {
  outline: none;
  border-color: var(--teal);
  background: #fff;
  box-shadow: 0 0 0 4px rgba(15, 255, 195, .3)
}

textarea {
  min-height: 120px;
  resize: vertical
}

.input-error {
  border-color: var(--coral);
  background: #FFF6F8
}

.form-error {
  margin-top: 6px;
  color: var(--coral-dark);
  font-size: 13px;
  font-weight: 600
}

.form-actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap
}

.form-help {
  margin-top: 12px;
  font-size: 13px;
  color: var(--muted)
}

.map {
  position: relative;
  height: 280px;
  border: 2px solid var(--teal);
  border-radius: 14px;
  cursor: crosshair;
  overflow: hidden;
  background: linear-gradient(rgba(0, 139, 155, .12) 1px, transparent 1px) 0 0/40px 40px, linear-gradient(90deg, rgba(0, 139, 155, .12) 1px, transparent 1px) 0 0/40px 40px, linear-gradient(135deg, #E3F6F8, #D3EEF2)
}

.map-label {
  position: absolute;
  left: 12px;
  top: 12px;
  padding: 4px 12px;
  border-radius: 999px;
  background: #fff;
  font-size: 12px;
  font-weight: 600;
  color: var(--teal-dark);
  box-shadow: var(--shadow)
}

.map-pin {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 34px;
  height: 42px;
  transform: translate(-50%, -100%)
}

.map-hint {
  margin-top: 8px;
  font-size: 13px;
  color: var(--muted)
}

.tips-card {
  background: linear-gradient(160deg, #fff, var(--mint-tint));
  position: sticky;
  top: 90px
}

.tips-card ul {
  margin: 12px 0 0;
  padding-left: 20px;
  color: var(--muted);
  font-size: 14px
}

.tips-card li {
  margin-bottom: 6px
}

/* ---------- 10. Success state ---------- */
.success-card {
  max-width: 620px;
  margin: 0 auto;
  padding: 40px 24px;
  text-align: center;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 24px;
  box-shadow: var(--shadow)
}

.success-icon {
  width: 68px;
  height: 68px;
  margin: 0 auto 16px;
  border-radius: 50%;
  background: var(--mint);
  color: var(--navy);
  font-size: 34px;
  font-weight: 700;
  display: grid;
  place-items: center;
  box-shadow: 0 0 0 8px var(--mint-tint)
}

.ref-number {
  display: inline-block;
  margin: 16px 0 24px;
  padding: 8px 20px;
  border-radius: 12px;
  background: var(--navy);
  color: var(--mint);
  font-weight: 700;
  letter-spacing: .05em
}

/* ---------- 11. Reports page ---------- */
.filter-bar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 18px
}

.filter-bar input {
  flex: 2 1 240px
}

.filter-bar select {
  flex: 1 1 150px;
  width: auto
}

.table-wrap {
  overflow-x: auto;
  padding: 6px 10px
}

.reports-table {
  width: 100%;
  border-collapse: collapse
}

.reports-table th {
  padding: 12px 14px;
  text-align: left;
  font-size: 12px;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--muted);
  border-bottom: 2px solid var(--border)
}

.reports-table td {
  padding: 14px;
  border-bottom: 1px solid var(--border);
  font-size: 14px
}

.reports-table tbody tr:hover td {
  background: var(--teal-tint)
}

.report-cards {
  display: none
}

.empty-state {
  padding: 44px 20px;
  text-align: center
}

/* ---------- 12. Details page ---------- */
.back-link {
  display: inline-block;
  margin-bottom: 14px;
  font-weight: 600;
  text-decoration: none
}

.info-list {
  display: grid;
  grid-template-columns: 140px 1fr;
  gap: 10px 14px;
  margin: 0;
  font-size: 14px
}

.info-list dt {
  color: var(--muted)
}

.info-list dd {
  margin: 0;
  font-weight: 600
}

.progress {
  display: flex
}

.progress-step {
  position: relative;
  flex: 1;
  text-align: center;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted)
}

.progress-step::before {
  content: "";
  position: absolute;
  top: 17px;
  left: -50%;
  width: 100%;
  height: 3px;
  background: var(--border)
}

.progress-step:first-child::before {
  display: none
}

.progress-step .dot {
  position: relative;
  z-index: 1;
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  margin: 0 auto 8px;
  border-radius: 50%;
  background: #fff;
  border: 3px solid var(--border)
}

.progress-step.is-done {
  color: var(--navy)
}

.progress-step.is-done::before {
  background: var(--teal)
}

.progress-step.is-done .dot {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff
}

.progress-step.is-current {
  color: var(--navy)
}

.progress-step.is-current::before {
  background: var(--teal)
}

.progress-step.is-current .dot {
  background: var(--mint);
  border-color: var(--mint);
  box-shadow: 0 0 0 5px rgba(15, 255, 195, .3)
}

/* ---------- 13. About page ---------- */
.faq-item {
  margin-bottom: 10px;
  padding: 4px 20px;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 14px
}

.faq-item summary {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 0;
  font-weight: 600;
  cursor: pointer;
  list-style: none
}

.faq-item summary::after {
  content: "+";
  color: var(--teal);
  font-size: 22px;
  line-height: 1
}

.faq-item[open] summary::after {
  content: "–"
}

.faq-item p {
  padding-bottom: 16px;
  color: var(--muted)
}

/* ---------- 14. Staff mode (used later) ---------- */
.staff-bar {
  padding: 6px 12px;
  background: var(--coral);
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  text-align: center
}

.staff-panel {
  border: 2px solid var(--coral);
  margin-top: 20px
}

/* ---------- 15. Footer ---------- */
.site-footer {
  margin-top: 30px;
  padding: 30px 0;
  background: var(--navy);
  color: #9CC0C6;
  font-size: 14px
}

.site-footer .container {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap
}

.site-footer strong {
  color: #fff
}

.site-footer b {
  color: var(--mint)
}

/* ---------- 16. Mobile ---------- */
@media (max-width:820px) {
  .nav-toggle {
    display: block
  }

  .nav-links {
    display: none;
    position: absolute;
    left: 0;
    right: 0;
    top: 68px;
    flex-direction: column;
    align-items: stretch;
    padding: 12px 20px 18px;
    background: var(--navy);
    border-bottom: 1px solid rgba(255, 255, 255, .1)
  }

  .nav-links.open {
    display: flex
  }

  .nav-links a.nav-cta {
    margin: 6px 0 0;
    text-align: center
  }

  .two-col {
    grid-template-columns: 1fr
  }

  .tips-card {
    position: static
  }

  .page-body {
    border-radius: 28px 28px 0 0
  }

  .table-wrap {
    display: none
  }

  .report-cards {
    display: block
  }

  .info-list {
    grid-template-columns: 110px 1fr
  }
}</style>
</head>
<body>
<div id="app"></div>
<script>

/* =========================================================
   data.js – constants and sample report data
   ========================================================= */

/* ---------- Settings ---------- */
const STORAGE_KEY = 'fixit_reports';      // where staff updates are saved in the browser
const STAFF_ACCESS_CODE = 'FIXIT-2026';   // demo code only
const DEMO_TODAY_ISO = '2026-10-22';      // date stamped on staff updates
const DEMO_TODAY_LABEL = '22 Oct';        // short date added to staff notes

/* ---------- Categories ---------- */
const CATEGORIES = [
  'Facilities & Repairs',
  'Electricity',
  'Water & Plumbing',
  'Internet & IT',
  'Cleanliness & Waste',
  'Safety & Security',
  'Accessibility',
  'Other'
];

/* ---------- Statuses ---------- */
// Status name -> CSS class used for its badge
const STATUS_BADGE_CLASS = {
  'Pending': 'badge-pending',
  'In Progress': 'badge-progress',
  'Resolved': 'badge-resolved'
};

// Order used to work out how far along a report is
const STATUS_ORDER = ['Pending', 'In Progress', 'Resolved'];

// Labels shown on the progress tracker (same order as STATUS_ORDER)
const PROGRESS_LABELS = ['Report Submitted', 'In Progress', 'Resolved'];

/* ---------- Sample reports ---------- */
// mapX / mapY are the pin position on the map (0 to 1)
const DEMO_REPORTS = [
  {
    id: 'FIX-2026-00124',
    title: 'Broken lights in the main library',
    category: 'Electricity',
    location: 'Main Library, 2nd floor reading hall',
    dateReported: '2026-10-19',
    lastUpdated: '2026-10-21',
    status: 'In Progress',
    priority: 'High',
    mapX: 0.25,

/* ---------- Load and save (staff updates persist in the browser) ---------- */
function loadReports() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (Array.isArray(saved) && saved.length > 0) return saved;
  } catch (error) {
    // storage unavailable or corrupted: fall back to the sample data
  }
  return DEMO_REPORTS;
}

function saveReports() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(reports));
  } catch (error) {
    // storage unavailable: changes last until the page is reloaded
  }
}

let reports = loadReports();

/* =========================================================
   helpers.js – small utility functions used everywhere
   ========================================================= */

/* Shortcut for document.querySelector */
const $ = selector => document.querySelector(selector);

/* "2026-10-19" -> "19 Oct 2026" */
function formatDate(isoDate) {
  return new Date(isoDate).toLocaleDateString('en-GB', {
    day: 'numeric',
    month: 'short',
    year: 'numeric'
  });
}

/* Make text safe to place inside HTML */
function escapeHtml(text) {
  const replacements = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' };
  return String(text).replace(/[&<>"]/g, character => replacements[character]);
}

/* Coloured status pill, e.g. "● Pending" */
function statusBadge(status) {
  return `<span class="badge ${STATUS_BADGE_CLASS[status]}">● ${status}</span>`;
}

/* Look up one report by its reference number */
function findReport(id) {
  return reports.find(report => report.id === id);
}

/* Build <option> tags for a <select>, marking the chosen one */
function selectOptions(values, selectedValue) {
  return values
    .map(value => `<option ${value === selectedValue ? 'selected' : ''}>${escapeHtml(value)}</option>`)
    .join('');
}

/* =========================================================
   components.js – reusable pieces of the pages
   Each function returns an HTML string.
   Needs: data.js, helpers.js, and a page script that defines
   `state`, `openReports()`, `openDetail(id)`, `backToReports()`.
   ========================================================= */

const LOGO_ICON = `
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#021F28"
       stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 22s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/>
    <path d="M8.5 10l2.5 2.5L15.5 8"/>
  </svg>`;

/* ---------------------------------------------------------
   1. Page frame: header, banner, footer
   --------------------------------------------------------- */

function navLink(label, action, isActive) {
  return `<a href="#" class="${isActive ? 'active' : ''}" onclick="${action};return false">${label}</a>`;
}

function toggleMenu(button) {
  button.nextElementSibling.classList.toggle('open');
}

function siteHeader(logoAction, navLinksHtml) {
  return `
    <header class="site-header">
      <div class="container nav">
        <a href="#" class="logo" onclick="${logoAction};return false" aria-label="FixIt home">
          <span class="logo-mark">${LOGO_ICON}</span>Fix<b>It</b>
        </a>
        <button class="nav-toggle" aria-label="Menu" onclick="toggleMenu(this)">☰</button>
        <nav class="nav-links">${navLinksHtml}</nav>
      </div>
    </header>`;
}

function pageBanner(title, subtitle) {
  return `
    <div class="page-banner">
      <div class="container">
        <h1>${title}</h1>
        <p>${subtitle}</p>
      </div>
    </div>`;
}

function siteFooter() {
  return `
    <footer class="site-footer">
      <div class="container">
        <div>
          <strong>Fix<b>It</b></strong>
          <p>Campus issue reporting for students, by students.</p>
        </div>
        <p>© 2026 FixIt. Prototype with demonstration data.</p>
      </div>
    </footer>`;
}

/* Put everything on the page.
   view = { banner: '<html>', content: '<html>' } */
function renderPage(headerHtml, topBarHtml, view) {
  $('#app').innerHTML = `
    ${headerHtml}
    ${topBarHtml}
    ${view.banner}
    <main>
      <div class="page-body">
        <div class="container">${view.content}</div>
      </div>
    </main>
    ${siteFooter()}`;
}

/* ---------------------------------------------------------
   2. Reports list: filters, table (desktop), cards (mobile)
   --------------------------------------------------------- */

/* Apply the current search, category, status and sort order */
function getVisibleReports() {
  const { search, category, status, sort } = state.filters;
  const searchText = search.toLowerCase();

  const matches = reports.filter(report => {
    const searchable = (report.title + report.description + report.location + report.id).toLowerCase();
    return (!category || report.category === category)
        && (!status || report.status === status)
        && (!searchText || searchable.includes(searchText));
  });

  return matches.sort((a, b) => {
    const byDate = a.dateReported.localeCompare(b.dateReported) || a.id.localeCompare(b.id);
    return sort === 'newest' ? -byDate : byDate;
  });
}

function filterBar() {
  const { search, category, status, sort } = state.filters;
  return `
    <div class="filter-bar">
      <input type="search" aria-label="Search reports"
             placeholder="Search title, description, location or reference"
             value="${escapeHtml(search)}"
             oninput="updateFilter('search', this.value)">

      <select aria-label="Category" onchange="updateFilter('category', this.value)">
        <option value="">All categories</option>
        ${selectOptions(CATEGORIES, category)}
      </select>

      <select aria-label="Status" onchange="updateFilter('status', this.value)">
        <option value="">All statuses</option>
        ${selectOptions(STATUS_ORDER, status)}
      </select>

      <select aria-label="Sort" onchange="updateFilter('sort', this.value)">
        <option value="newest">Newest first</option>
        <option value="oldest" ${sort === 'oldest' ? 'selected' : ''}>Oldest first</option>
      </select>

      <button class="btn btn-outline" onclick="openReports()">Clear filters</button>
    </div>`;
}

function emptyState() {
  return `
    <div class="card empty-state">
      <div style="font-size:42px">🔍</div>
      <h3 style="margin:8px 0">No reports found. Try changing your filters.</h3>
      <p class="text-muted" style="margin-bottom:18px">Nothing matches your search yet.</p>
      <button class="btn" onclick="openReports()">Clear filters</button>
    </div>`;
}

function reportsTable(rows) {
  const tableRows = rows.map(report => `
    <tr>
      <td><b>${report.id}</b></td>
      <td>${report.title}</td>
      <td>${report.category}</td>
      <td>${report.location}</td>
      <td>${formatDate(report.dateReported)}</td>
      <td>${statusBadge(report.status)}</td>
      <td><button class="btn btn-outline btn-sm" onclick="openDetail('${report.id}')">View Details</button></td>
    </tr>`).join('');

  return `
    <div class="card table-wrap">
      <table class="reports-table">
        <thead>
          <tr>
            <th>Reference</th><th>Issue</th><th>Category</th><th>Location</th>
            <th>Reported</th><th>Status</th><th></th>
          </tr>
        </thead>
        <tbody>${tableRows}</tbody>
      </table>
    </div>`;
}

function reportCards(rows) {
  const cards = rows.map(report => `
    <div class="card" style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:start">
        <small class="text-muted">${report.id}</small>
        ${statusBadge(report.status)}
      </div>
      <h3 style="margin:8px 0 4px">${report.title}</h3>
      <p class="text-muted" style="font-size:13px">
        ${report.category} · ${report.location}<br>${formatDate(report.dateReported)}
      </p>
      <button class="btn btn-outline btn-sm" style="margin-top:12px"
              onclick="openDetail('${report.id}')">View Details</button>
    </div>`).join('');

  return `<div class="report-cards">${cards}</div>`;
}

/* Table + cards, or the empty message */
function resultsHtml() {
  const rows = getVisibleReports();
  if (rows.length === 0) return emptyState();
  return reportsTable(rows) + reportCards(rows);
}

/* Redraw only the results (keeps the cursor in the search box) */
function refreshResults() {
  $('#results').innerHTML = resultsHtml();
}

/* Full reports view */
function reportsView(title, subtitle) {
  return {
    banner: pageBanner(title, subtitle),
    content: `${filterBar()}<div id="results"></div>`
  };
}

/* ---------------------------------------------------------
   3. Report detail: progress, info, staff update, map
   --------------------------------------------------------- */

function progressTracker(report) {
  const currentStep = STATUS_ORDER.indexOf(report.status);

  const steps = PROGRESS_LABELS.map((label, index) => {
    const stateClass = index < currentStep ? 'is-done' : index === currentStep ? 'is-current' : '';
    const dotContent = index < currentStep ? '✓' : index + 1;
    return `<div class="progress-step ${stateClass}"><span class="dot">${dotContent}</span>${label}</div>`;
  }).join('');

  return `
    <div class="card" style="margin-bottom:20px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px">
        <h3>Status progress</h3>
        ${statusBadge(report.status)}
      </div>
      <div class="progress">${steps}</div>
    </div>`;
}

function issueInfoCard(report) {
  return `
    <div class="card" style="margin-bottom:20px">
      <h3 style="margin-bottom:14px">Issue information</h3>
      <p style="margin-bottom:16px">${report.description}</p>
      <dl class="info-list">
        <dt>Category</dt><dd>${report.category}</dd>
        <dt>Location</dt><dd>${report.location}</dd>
        <dt>Date reported</dt><dd>${formatDate(report.dateReported)}</dd>
        <dt>Last updated</dt><dd>${formatDate(report.lastUpdated)}</dd>
        <dt>Priority</dt><dd>${report.priority}</dd>
      </dl>
    </div>`;
}

function staffUpdateCard(report) {
  return `
    <div class="card">
      <h3 style="margin-bottom:10px">Staff update</h3>
      <p class="text-muted">${report.staffNote || 'No updates available yet.'}</p>
    </div>`;
}

/* Map with a pin at the report's position */
function campusMap(report) {
  const pinStyle = `left:${report.mapX * 100}%;top:${report.mapY * 100}%`;
  return `
    <div class="map" style="cursor:default" role="img" aria-label="Campus map">
      <span class="map-label">Campus map</span>
      <svg class="map-pin" style="${pinStyle}" viewBox="0 0 30 40">
        <path d="M15 40C5 26 0 20 0 14a15 15 0 1 1 30 0c0 6-5 12-15 26z" fill="#FF4078"/>
        <circle cx="15" cy="14" r="6" fill="#021F28"/>
      </svg>
    </div>`;
}

function locationCard(report) {
  return `
    <div class="card">
      <h3 style="margin-bottom:12px">Location</h3>
      ${campusMap(report)}
      <p class="map-hint">📍 ${report.location}</p>
    </div>`;
}

/* Full detail view. `extraHtml` is shown under the staff update
   (the staff page passes its controls panel here). */
function detailView(extraHtml) {
  const report = findReport(state.selectedReportId);
  return {
    banner: pageBanner(report.title, report.id),
    content: `
      <a href="#" class="back-link" onclick="backToReports();return false">← Back to Reports</a>
      ${progressTracker(report)}
      <div class="two-col">
        <div>
          ${issueInfoCard(report)}
          ${staffUpdateCard(report)}
          ${extraHtml}
        </div>
        ${locationCard(report)}
      </div>`
  };
}

/* =========================================================
   reports.js – the public "View Reports" page
   ========================================================= */

/* ---------- 1. State ---------- */
const DEFAULT_FILTERS = { search: '', category: '', status: '', sort: 'newest' };

const state = {
  view: 'reports',            // 'reports' or 'detail'
  selectedReportId: null,
  filters: { ...DEFAULT_FILTERS }
};

/* ---------- 2. Navigation ---------- */
function openReports() {
  state.filters = { ...DEFAULT_FILTERS };   // fresh list
  state.view = 'reports';
  draw();
  scrollTo(0, 0);
}

function backToReports() {
  state.view = 'reports';                   // keeps the filters you had
  draw();
  scrollTo(0, 0);
}

function openDetail(id) {
  state.selectedReportId = id;
  state.view = 'detail';
  draw();
  scrollTo(0, 0);
}

function updateFilter(name, value) {
  state.filters[name] = value;
  refreshResults();
}

/* ---------- 3. Drawing ---------- */
function draw() {
  const navLinks = navLink('View Reports', 'openReports()', true);

  const view = state.view === 'detail'
    ? detailView('')
    : reportsView('Campus <span>Issue Reports</span>', 'Browse reported problems and check their current status.');

  renderPage(siteHeader('openReports()', navLinks), '', view);

  if (state.view === 'reports') refreshResults();
}

draw();
</script>
